# Configuration for your own ESPHome dashboard. Copy only this file.
# It gets the Koala firmware from GitHub. You do not need other files.

substitutions:
  # Release of the Koala firmware. To update the device, set a newer release.
  koala_ref: 2026.10.2

packages:
  koala:
    url: https://github.com/formatBCE/Koala-Satellite
    ref: ${koala_ref}
    refresh: 1d
    files:
      - config/common/koala-base.yaml

esphome:
  friendly_name: Koala Satellite
  name_add_mac_suffix: false

wifi:
  ap:
    ssid: "Koala Satellite"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
