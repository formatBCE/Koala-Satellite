name: Release

# A push to main that changes esphome.project.version in packages/koala/device.yaml
# publishes that version: factory firmware and manifest on GitHub Pages, the OTA
# mirror in ota/, and a GitHub release with a tag. A push without a new version
# does nothing. Run it by hand to add a summary for the update entity.

on:
  push:
    branches: [main]
    paths:
      - packages/koala/device.yaml
  workflow_dispatch:
    inputs:
      summary:
        description: "Short summary that the update entity in Home Assistant shows (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLISH_URL: https://formatbce.github.io/Koala-Satellite
  FACTORY_YAML: config/koala-satellite.yaml
  LITE_REPO: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration
  # Build tools. Raise them on purpose, so that a release is reproducible.
  ESPHOME_VERSION: "2026.9.1"
  EWT_GEN_VERSION: "1.6.1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its release
        id: version
        run: |
          V=$(grep -E '^[[:space:]]*version:' packages/koala/device.yaml | head -n1 \
              | sed -E 's/.*version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          test -n "$V" || { echo "::error::No esphome.project.version in packages/koala/device.yaml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Release $V exists. Bump esphome.project.version in packages/koala/device.yaml first."
              exit 1
            fi
            echo "Release $V exists. Nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $V. Publishing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the release is consistent
        if: steps.version.outputs.release == 'true'
        run: |
          V='${{ steps.version.outputs.version }}'
          value() { grep -E "^[[:space:]]*$1:" "$2" | head -n1 | sed -E "s/.*$1:[[:space:]]*\"?([^\"]+)\"?[[:space:]]*\$/\\1/"; }
          for f in config/koala-satellite.yaml config/koala-dashboard.yaml; do
            REF=$(value koala_ref "$f")
            if [ "$REF" != "$V" ]; then
              echo "::error::koala_ref in $f is '$REF'. Set it to $V."
              exit 1
            fi
          done
          LITE=$(value respeaker_lite_ref config/common/koala-base.yaml)
          if ! git ls-remote --exit-code --tags "$LITE_REPO" "refs/tags/$LITE" > /dev/null; then
            echo "::error::respeaker_lite_ref is '$LITE', but $LITE_REPO has no such tag."
            exit 1
          fi
          echo "Koala $V uses Respeaker Lite $LITE."

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        # ewt-gen uses the esphome on PATH, so this pins the ESPHome version.
        run: pip install uv "esphome==$ESPHOME_VERSION"

      - name: Build the factory and OTA firmware, and the site
        env:
          V: ${{ needs.prepare.outputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          uvx "ewt-gen@$EWT_GEN_VERSION" "$FACTORY_YAML" \
            --output dist \
            --publish-url "$PUBLISH_URL" \
            --fw-version "$V" \
            --import-url "github://formatBCE/Koala-Satellite/config/common/koala-base.yaml@$V" \
            --release-url "https://github.com/formatBCE/Koala-Satellite/releases/tag/$V" \
            --release-summary "${SUMMARY:-Koala Satellite $V}"
          ls -la dist/

      - name: Check the manifest
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          v = os.environ["V"]
          m = json.loads(pathlib.Path("dist/manifest.json").read_text())
          assert m["version"] == v, f"manifest version {m['version']} is not {v}"
          b = m["builds"][0]
          for part in b["parts"]:
              assert pathlib.Path("dist", part["path"]).is_file(), part
          assert "ota" in b, "manifest has no ota entry, so devices cannot update"
          assert pathlib.Path("dist", b["ota"]["path"]).is_file(), b["ota"]
          print(json.dumps(m, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@v4

  mirror-ota-and-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Refresh ota/ (latest only)
        run: |
          rm -rf ota
          mkdir -p ota
          cp dist/manifest.json dist/*.ota.bin ota/
          ls -la ota/

      - name: Commit ota/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ota/
          git commit -m "OTA: $V" || { echo "No changes in ota/"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.V }}
          body: ${{ inputs.summary }}
          generate_release_notes: true
          files: |
            dist/firmware-*.bin
